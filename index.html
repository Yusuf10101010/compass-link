
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Compass Link</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111318;color:#f2f3f5;font:16px system-ui,sans-serif}
main{max-width:800px;margin:auto;padding:15px}
.card{background:#1a1d24;border:1px solid #343945;border-radius:15px;padding:16px;margin:12px 0}
input,textarea{display:block;width:100%;padding:12px;margin:7px 0 13px;background:#101217;color:white;border:1px solid #343945;border-radius:9px}
button{padding:10px 14px;border:0;border-radius:9px;background:#d4d8df;color:#111318;font-weight:bold;margin:3px;cursor:pointer}
.secondary{background:#292e38;color:white}
.hidden{display:none!important}
.muted{color:#a7adba;font-size:14px}
nav{display:flex;gap:5px;flex-wrap:wrap}
.avatar{width:76px;height:76px;object-fit:cover;border-radius:50%;background:#343945}
.small{width:45px;height:45px}
.row{display:flex;align-items:center;gap:12px}
.postimg{width:100%;max-height:450px;object-fit:contain;margin-top:10px}
.status{background:#292e38;padding:12px;border-radius:9px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<header class="card">
<h1>COMPASS LINK</h1>
<p class="muted">Find your people. Build your future.</p>
<button id="logout" class="secondary hidden">Log out</button>
</header>
<div id="status" class="status hidden"></div>

<section id="auth" class="card">
<h2>Welcome to Compass Link</h2>
<button id="loginMode">Log in</button>
<button id="registerMode" class="secondary">Create account</button>
<form id="authForm">
<div id="nameBox" class="hidden">
<label>Full name</label><input id="name" autocomplete="name">
</div>
<label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" minlength="6" required>
<button id="authButton">Log in</button>
<button type="button" id="forgot" class="secondary">Forgot password?</button>
</form>
</section>

<section id="app" class="hidden">
<nav>
<button data-tab="feed">Feed</button>
<button data-tab="profile" class="secondary">My profile</button>
<button data-tab="people" class="secondary">Find students</button>
<button data-tab="connections" class="secondary">Connections</button>
</nav>

<section id="feedTab">
<div class="card">
<h2>Create a post</h2>
<form id="postForm">
<textarea id="postText" placeholder="What would you like to share?"></textarea>
<label>Attach a picture</label>
<input id="postFile" type="file" accept="image/*">
<button>Publish post</button>
</form>
</div>
<div id="feed"></div>
</section>

<section id="profileTab" class="hidden">
<div class="card">
<div class="row">
<img id="avatar" class="avatar" alt="Profile picture">
<div><h2 id="profileTitle">My profile</h2><p class="muted">Your student profile</p></div>
</div>
<form id="profileForm">
<label>Profile picture</label>
<input id="avatarFile" type="file" accept="image/*">
<label>Full name</label><input id="profileName" required>
<label>University or school</label><input id="university">
<label>Department</label><input id="department">
<label>Course</label><input id="course">
<label>Level</label><input id="level">
<label>Interests</label><input id="interests">
<label>About me</label><textarea id="bio"></textarea>
<button>Save profile</button>
</form>
</div>
</section>

<section id="peopleTab" class="hidden">
<div class="card">
<h2>Find students</h2>
<input id="search" placeholder="Search name, school or department">
<div id="people"></div>
</div>
</section>

<section id="connectionsTab" class="hidden">
<div class="card"><h2>Connection requests</h2><div id="requests"></div></div>
<div class="card"><h2>My connections</h2><div id="connected"></div></div>
</section>
</section>
</main>

<script>
const URL="https://ttvbqeswhluwsypajexu.supabase.co";
const KEY="sb_publishable_e6wd2Pl5XgRewevV2f8Sbw_45I7_Mrm";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let user=null,profile={},registering=false;
const blankAvatar="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#343945"/><circle cx="50" cy="35" r="19" fill="#a7adba"/><path d="M12 100 Q15 60 50 60 Q85 60 88 100" fill="#a7adba"/></svg>');
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(t){$("status").textContent=t;$("status").classList.remove("hidden")}
function switchMode(r){registering=r;$("nameBox").classList.toggle("hidden",!r);$("name").required=r;$("authButton").textContent=r?"Create account":"Log in"}
$("loginMode").onclick=()=>switchMode(false);
$("registerMode").onclick=()=>switchMode(true);

$("authForm").onsubmit=async e=>{
e.preventDefault();
try{
let r;
if(registering){
r=await db.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{data:{full_name:$("name").value.trim()}}});
if(r.error)throw r.error;
if(!r.data.session){message("Account created. Check your email for confirmation, then log in.");return}
}else{
r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
if(r.error)throw r.error;
}
user=r.data.user;await start();
}catch(e){message("Login error: "+e.message)}
};
$("forgot").onclick=async()=>{
if(!$("email").value.trim())return message("Enter your email first.");
const {error}=await db.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo:location.href});
message(error?error.message:"Check your email for password reset instructions.");
};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};

async function start(){
if(!user){const r=await db.auth.getUser();user=r.data.user}
if(!user)return;
$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");
await loadProfile();showTab("feed");
}
function showTab(tab){
["feed","profile","people","connections"].forEach(t=>{
$(t+"Tab").classList.toggle("hidden",t!==tab);
document.querySelector(`[data-tab="${t}"]`).className=t===tab?"":"secondary";
});
if(tab==="feed")loadFeed();
if(tab==="people")searchPeople();
if(tab==="connections")loadConnections();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

async function upload(file,bucket,kind){
if(!file)return null;
if(!file.type.startsWith("image/"))throw Error("Choose an image file.");
if(file.size>5*1024*1024)throw Error("Image must be under 5 MB.");
const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"")||"jpg";
const path=user.id+"/"+kind+"-"+Date.now()+"."+ext;
const {error}=await db.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});
if(error)throw error;
return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

async function loadProfile(){
const {data,error}=await db.from("student_profiles").select("*").eq("id",user.id).maybeSingle();
if(error){message("Profile error: "+error.message);return}
profile=data||{};
$("profileName").value=profile.full_name||user.user_metadata?.full_name||"";
["university","department","course","level","interests","bio"].forEach(k=>$(k).value=profile[k]||"");
$("avatar").src=profile.avatar_url||blankAvatar;
$("profileTitle").textContent=profile.full_name||"My profile";
}
$("profileForm").onsubmit=async e=>{
e.preventDefault();const b=e.submitter;b.disabled=true;
try{
let pic=profile.avatar_url||null;
if($("avatarFile").files[0])pic=await upload($("avatarFile").files[0],"profile-images","avatar");
const p={id:user.id,full_name:$("profileName").value.trim(),university:$("university").value.trim(),department:$("department").value.trim(),course:$("course").value.trim(),level:$("level").value.trim(),interests:$("interests").value.trim(),bio:$("bio").value.trim(),updated_at:new Date().toISOString()};
if(pic)p.avatar_url=pic;
const {error}=await db.from("student_profiles").upsert(p,{onConflict:"id"});
if(error)throw error;
profile={...profile,...p};$("avatar").src=pic||blankAvatar;$("profileTitle").textContent=p.full_name;
$("avatarFile").value="";message("Profile saved successfully.");
}catch(e){message("Could not save profile: "+e.message)}
finally{b.disabled=false}
};

$("postForm").onsubmit=async e=>{
e.preventDefault();const b=e.submitter;b.disabled=true;
try{
const content=$("postText").value.trim(),file=$("postFile").files[0];
if(!content&&!file)throw Error("Write a post or choose a picture.");
let image_url=null;if(file)image_url=await upload(file,"post-media","post");
const post={user_id:user.id,content,created_at:new Date().toISOString()};
if(image_url)post.image_url=image_url;
const {error}=await db.from("posts").insert(post);if(error)throw error;
$("postText").value="";$("postFile").value="";message("Post published.");await loadFeed();
}catch(e){message("Could not publish post: "+e.message)}
finally{b.disabled=false}
};

async function loadFeed(){
const host=$("feed");host.innerHTML='<div class="card">Loading posts…</div>';
try{
const {data:posts,error}=await db.from("posts").select("*").order("created_at",{ascending:false}).limit(50);
if(error)throw error;
if(!posts.length){host.innerHTML='<div class="card">No posts yet. Share the first one!</div>';return}
const ids=[...new Set(posts.map(p=>p.user_id||p.profile_id).filter(Boolean))];
const pr=ids.length?await db.from("student_profiles").select("id,full_name,avatar_url,university,department").in("id",ids):{data:[]};
const people=Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));
host.innerHTML="";
for(const p of posts){
const who=people[p.user_id||p.profile_id]||{};
const pic=p.image_url||p.media_url||p.photo_url;
const card=document.createElement("article");card.className="card";
card.innerHTML=`<div class="row"><img class="avatar small" src="${esc(who.avatar_url||blankAvatar)}"><div><b>${esc(who.full_name||"Compass Link member")}</b><div class="muted">${esc(who.university||"")} · ${esc(p.created_at?new Date(p.created_at).toLocaleString():"")}</div></div></div><p>${esc(p.content||p.body||"").replace(/\n/g,"<br>")}</p>${pic?`<img class="postimg" src="${esc(pic)}">`:""}<button class="secondary like">♡ Like</button><button class="secondary commentButton">Comment</button><div class="comments hidden"></div>`;
const like=card.querySelector(".like"),comments=card.querySelector(".comments");
like.onclick=async()=>{
try{
const {data,error}=await db.from("post_likes").select("id").eq("post_id",p.id).eq("user_id",user.id).maybeSingle();
if(error)throw error;
if(data){const r=await db.from("post_likes").delete().eq("id",data.id);if(r.error)throw r.error;like.textContent="♡ Like"}
else{const r=await db.from("post_likes").insert({post_id:p.id,user_id:user.id});if(r.error)throw r.error;like.textContent="♥ Liked"}
}catch(e){message("Like error: "+e.message)}
};
card.querySelector(".commentButton").onclick=async()=>{
comments.classList.toggle("hidden");
if(comments.dataset.ready)return;
comments.innerHTML='<input placeholder="Write a comment"><button>Send comment</button><div class="commentList"></div>';
const input=comments.querySelector("input"),send=comments.querySelector("button"),list=comments.querySelector(".commentList");
send.onclick=async()=>{
if(!input.value.trim())return;
const {error}=await db.from("post_comments").insert({post_id:p.id,user_id:user.id,content:input.value.trim()});
if(error)message("Comment error: "+error.message);else{input.value="";getComments(p.id,list)}
};
comments.dataset.ready="1";getComments(p.id,list);
};
host.appendChild(card);
}
}catch(e){host.innerHTML='<div class="card">Could not load posts: '+esc(e.message)+'</div>'}
}
async function getComments(id,host){
const {data,error}=await db.from("post_comments").select("*").eq("post_id",id).order("created_at");
if(error){host.textContent=error.message;return}
host.innerHTML=(data||[]).map(c=>'<p class="muted">'+esc(c.content||c.comment||"")+'</p>').join("")||'<p class="muted">No comments yet.</p>';
}

$("search").oninput=searchPeople;
async function searchPeople(){
if(!user)return;const host=$("people"),term=$("search").value.trim();
try{
let q=db.from("student_profiles").select("id,full_name,university,department,level,avatar_url").neq("id",user.id).limit(40);
if(term)q=q.or(`full_name.ilike.%${term}%,university.ilike.%${term}%,department.ilike.%${term}%`);
const {data,error}=await q;if(error)throw error;
host.innerHTML="";
if(!data.length){host.textContent="No student profiles found yet.";return}
data.forEach(p=>{
const el=document.createElement("div");el.className="card row";
el.innerHTML=`<img class="avatar small" src="${esc(p.avatar_url||blankAvatar)}"><div style="flex:1"><b>${esc(p.full_name||"Student")}</b><p class="muted">${esc([p.university,p.department,p.level].filter(Boolean).join(" · "))}</p></div><button>Connect</button>`;
el.querySelector("button").onclick=async ev=>{
ev.currentTarget.disabled=true;
const {error}=await db.from("connection_requests").insert({sender_id:user.id,receiver_id:p.id,status:"pending"});
if(error){message("Connection error: "+error.message);ev.currentTarget.disabled=false}
else{ev.currentTarget.textContent="Requested";message("Request sent.")}
};host.appendChild(el);
});
}catch(e){host.textContent="Search error: "+e.message}
}

async function loadConnections(){
try{
const {data:incoming,error}=await db.from("connection_requests").select("*").eq("receiver_id",user.id).eq("status","pending");
if(error)throw error;
const {data:outgoing,error:e2}=await db.from("connection_requests").select("*").eq("sender_id",user.id);
if(e2)throw e2;
const ids=[...new Set([...(incoming||[]).map(r=>r.sender_id),...(outgoing||[]).filter(r=>r.status==="accepted").map(r=>r.receiver_id)])];
const pr=ids.length?await db.from("student_profiles").select("id,full_name,university,avatar_url").in("id",ids):{data:[]};
const people=Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));
$("requests").innerHTML="";
if(!incoming.length)$("requests").textContent="No pending requests.";
for(const r of incoming){
const p=people[r.sender_id]||{},el=document.createElement("div");el.className="card row";
el.innerHTML=`<img class="avatar small" src="${esc(p.avatar_url||blankAvatar)}"><div style="flex:1"><b>${esc(p.full_name||"Student")}</b></div><button>Accept</button>`;
el.querySelector("button").onclick=async()=>{
const {error}=await db.from("connection_requests").update({status:"accepted"}).eq("id",r.id);
if(error)message(error.message);else loadConnections();
};$("requests").appendChild(el);
}
const accepted=(outgoing||[]).filter(r=>r.status==="accepted");
$("connected").innerHTML=accepted.map(r=>{const p=people[r.receiver_id]||{};return `<div class="card row"><img class="avatar small" src="${esc(p.avatar_url||blankAvatar)}"><b>${esc(p.full_name||"Student")}</b></div>`}).join("")||"No accepted connections yet.";
}catch(e){$("requests").textContent="Could not load requests: "+e.message;$("connected").textContent="Check connection table permissions."}
}
db.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;start()}});
db.auth.onAuthStateChange((event,session)=>{
if(session&&(!user||user.id!==session.user.id)){user=session.user;setTimeout(start,0)}
if(!session&&event==="SIGNED_OUT")location.reload();
});
</script>
</body>
</html>
